  fatos:
    - 'Estudo Poinelli et al., Nature Communications (UC Irvine + NASA JPL, out/2026): contribuição da Thwaites até 2100 dobra, de ~1,5 cm (1,52 cm, média dos modelos) para ~3 cm (3,01 cm), mesmo sem aquecimento extra (CNN 15/10/2026; Exame)'
    - 'Mecanismo: a maré bombeia água morna do oceano por quilômetros por baixo do gelo apoiado e derrete a base (Phys.org/UCI; CNN)'
    - 'Thwaites: 192 mil km² (Paraná: 199,3 mil km², IBGE); frente de 120 km; potencial total ~65 cm de mar se derreter toda (Science/Voosen via Wikipedia)'
    - 'Gelo flutuante quase não muda o nível ao derreter (Arquimedes; NSIDC); gelo apoiado em terra soma água nova ao oceano'
    - '1 mm de nível do mar global = 361,8 km³ de água (oceanos: 361,8 milhões de km²; antarcticglaciers.org)'
    - 'Antártica inteira: 57,9 m de nível do mar equivalente (BedMachine, Morlighem); volume 26,5 milhões de km³'
    - 'O mar já subiu 21 a 24 cm desde 1880; o ritmo passou de 1,4 mm/ano (séc. XX) para 3,6 mm/ano (2006–2015), mais que o dobro (NOAA Climate.gov)'
    - 'Nei esteve na Antártica em 2004 (expedição de 11 a 21/01/2004, relato oficial no INEMA) e 2006, e no Ártico em 2007 e 2008 (matérias INEMA 2009 e 2010, fotos dele)'

