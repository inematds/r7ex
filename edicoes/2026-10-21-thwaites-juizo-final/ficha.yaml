  contexto: 'Short vertical do INEMA (Nei Maldaner, que esteve na Antártica em 2004 e 2006 e no Ártico em 2007 e 2008). Estudo de Poinelli et al. (UC Irvine e NASA JPL) na Nature Communications, outubro de 2026: a maré bombeia água morna por baixo da geleira Thwaites (192 mil km², quase o tamanho do Paraná) e a contribuição dela para o mar até 2100 dobra, de ~1,5 cm para ~3 cm, mesmo sem aquecimento extra; sozinha ela guarda ~65 cm de mar. Gelo que boia quase não muda o nível; gelo apoiado em terra, como o da Antártica, é água nova no oceano. Conta: 362 km³ de água = 1 mm de mar no planeta; a Antártica guarda ~58 m. O mar já subiu 21–24 cm desde 1880 e o ritmo mais que dobrou (NOAA). Nunca use a palavra morte. Pergunta: de que cidade você é? Termine com: No inema.club você pode aprender sobre inteligência artificial: https://inema.club'
