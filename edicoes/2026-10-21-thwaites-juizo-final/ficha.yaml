tema: "Geleira do Juízo Final: o mar pode subir o dobro — e a conta que prova que o mar sobe"
pedido: 'Nei, 21/10/2026: "faça um vídeo estilo eventosextremos sobre a notícia explicando como é a questão do mar subir do degelo,
  e a quantidade de água fora do mar com o gelo acima da superfície; medir e mostrar o tamanho do glacial sobre outros mapas para dar
  dimensão, mostrar números e cálculos, pois o povo não acredita que o mar possa subir... faça um explicativo 16x9 e outro r7ex, use o
  avatar, coloque no lives10; minhas fotos são só para usar algumas". Nei esteve na Antártica (2004 e 2006) e no Ártico (2007 e 2008).'

