slug: prov-anos-uma-foto
tema: 'Um robô treina uma tarefa a partir de UMA foto da mesa (Real2Sim): e se a tarefa que você levou anos para dominar ele aprender assim?'
pedido: 'Nei, 29/10/2026: "vamos fazer um teste com as sugestoes q vc falou sobre os robos faz aqueles videos e me manda". TESTE do gancho de provocação (PADRAO §2.2), mesmo miolo de 2026-10-28-robo-foto-emprego;
  só a abertura muda.'
plano:
  pessoa: qualquer trabalhador que faz uma tarefa manual ou repetitiva (fábrica, estoque, montagem, logística) e ouve falar de robô com IA, não o especialista em robótica
  quer: não perder o emprego para um robô (dor) e virar quem sabe ensinar e operar o robô (desejo)
  gancho: 'perda hipotética: e se o trabalho que você levou anos para aprender um robô aprender com uma foto? Prova: o Google mostrou uma foto da mesa virando simulação e o robô real subindo de 56% para
    75% de acerto (Gemini 4 Argon, 13/10/2026)'
  nota: 8
  destino: 'https://eventos.inema.pro/robot/ (área Robot do INEMA: a simulação Real2Sim que treina o robô a partir de uma foto + 7 cursos, entre eles Robótica do Zero ao Expert, 180 h; ''Tudo aberto e gratuito'')'
  fatos:
  - 'Google, post ''Gemini 4 Argon for Robotics'' (https://developers.googleblog.com/en/gemini-4-argon-for-robotics/, 13/10/2026), resumido em ~/projetos/output/robotica-NL0yDYXAQ0E/pesquisa.md §1.5: ''a
    partir de UMA foto RGB aérea de uma bancada bimanual ... Argon reconstrói malhas ... no MuJoCo ... exporta 4.500+ episódios ... Resultado: taxa de sucesso no robô físico de 56% para 75% e tempo de conclusão
    de 35 s para 24 s'' (o VLA usado e o tamanho do teste não são informados — vai na linha de fonte)'
  - 'mesma fonte: ''4.500+ episódios com aleatorização de domínio'' — base de ''treina milhares de vezes'' na simulação antes de fazer de verdade'
  - 'guia robotica-real2sim (https://inematds.github.io/robotica-real2sim/guia/, conferido 28/10/2026): ''O gargalo da robótica sempre foi dado: gente de óculos de VR guiando o braço por horas. Aqui o dado
    sai da simulação, e a simulação sai de uma foto.'' — base do ''antes, alguém guiava o braço por horas'''
  - 'README robotica-real2sim: ''Precisa de Python, do MuJoCo (simulador gratuito)'' e ''serve para quem quer entender e testar robótica com IA sem ter robô'' — base de ''não precisa ter robô, dá pra começar
    no computador'''
  - 'página https://eventos.inema.pro/robot/ (conferida 28/10/2026): ''aqui estão os cursos abertos, a simulação que treina o robô a partir de uma foto ... Tudo aberto e gratuito'', ''7 cursos'', ''Curso
    · PT · 180 h Robótica do Zero ao Expert'' — base de ''aberto e gratuito'' na fala e do print'
  - 'medo do emprego: é perda HIPOTÉTICA (pergunta ''e se''), não afirmação de que robôs estão tirando empregos; nenhum número de demissão é dito'
