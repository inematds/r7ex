  branco: A ERA DAS FERRAMENTAS ACABOU
  destaque: QUEM CAÇA APP É SUPERFICIAL
  cor: vermelho
  cena: uma pessoa de costas afundada até o peito numa avalanche de dezenas de caixas e cartões luminosos de aplicativos genéricos (sem logos)
