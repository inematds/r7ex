trocas:
  três coisas: 3 coisas
partes:
- etapa: gancho
  fala: A era das ferramentas acabou. Quem ainda corre atrás do aplicativo novo está sendo superficial.
  painel:
    k: CAÇADOR DE APP
    de: Quem
    borda: red
    itens:
    - - corre
      - 🏃 corre atrás do app novo
    - - superficial
      - 🫥 fica no superficial
- etapa: medo
  fala: O código de quase tudo já está no GitHub, de graça, e o Claude e o Codex fazem o que você pedir.
  imagem: um cofre-biblioteca gigante e escuro com prateleiras infinitas de pastas de código luminosas em amarelo; um robô humanoide de visor
    preto puxa uma pasta brilhante e entrega a uma mão humana; sensação de que tudo já existe
  painel:
    k: TÁ TUDO NO GIT
    itens:
    - - código
      - 📦 o código já existe
    - - graça
      - 🆓 de graça no GitHub
    - - Codex
      - 🤖 Claude e Codex fazem
- etapa: desejo
  fala: 'Mas se não souber pedir, perdeu: enquanto você testa o aplicativo da semana, outro já mandou o agente fazer o trabalho inteiro.'
  imagem: 'cena dividida: à esquerda, uma pessoa exausta de costas diante de dez janelas de aplicativos abertas, luz vermelha; à direita, outra
    pessoa relaxada de costas enquanto um robô de visor preto trabalha num monitor com um check amarelo grande'
  painel:
    k: NÃO SABE PEDIR?
    borda: red
    itens:
    - - perdeu
      - ❌ perdeu
    - - testa
      - 🧪 você testa o app da semana
    - - inteiro
      - ✅ o outro já entregou
- etapa: facilidade
  fala: E pedir bem se aprende rápido, não precisa ser programador.
  imagem: mão escrevendo num caderno numa mesa escura à noite, ao lado de um notebook com uma conversa de IA; uma lâmpada amarela luminosa acesa
    sobre a mesa; sensação de 'entendi'
  painel:
    k: SE APRENDE RÁPIDO
    itens:
    - - aprende
      - ⚡ aprende rápido
    - - programador
      - ✅ sem programar
- etapa: descoberta
  fala: 'São três coisas: o que você quer, o contexto e como conferir.'
  imagem: 'três objetos luminosos alinhados numa mesa preta como produto de luxo: um alvo dourado, uma pasta aberta com um mapa luminoso e uma
    prancheta com um check amarelo'
  painel:
    k: PEDIR BEM = 3 COISAS
    itens:
    - - quer
      - 1️⃣ o que você quer
    - - contexto
      - 2️⃣ o contexto
    - - conferir
      - 3️⃣ como conferir
- etapa: beneficio
  fala: Quem sabe pedir usa qualquer ferramenta, até a que nem saiu ainda.
  imagem: uma pessoa de costas, confiante, comandando com um gesto três robôs humanoides de visor preto, cada um segurando uma ferramenta luminosa
    diferente (chave inglesa, pincel, engrenagem); luz amarela
  painel:
    k: QUALQUER FERRAMENTA
    borda: vd
    itens:
    - - qualquer
      - 🧰 qualquer ferramenta
    - - saiu
      - 🆕 até a que nem saiu
