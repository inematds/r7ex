tema: 'Figure, Atlas e Optimus correm para trabalhar em fábricas em escala: e se o robô ficar com o seu trabalho?'
pedido: 'Nei, 29/10/2026: "vamos fazer um teste com as sugestoes q vc falou sobre os robos faz aqueles videos e me manda". TESTE do gancho de provocação (PADRAO §2.2), mesmo miolo de 2026-10-28-corrida-humanoides-emprego;
  só a abertura muda.'
plano:
  pessoa: quem trabalha em fábrica, armazém, logística ou qualquer serviço repetitivo e já viu vídeo de robô humanoide e pensou no próprio emprego
  quer: não ser trocado por um robô (dor) e virar a pessoa que opera e programa esses robôs (desejo)
  gancho: 'perda hipotética do emprego, com fato: a Hyundai e a Boston Dynamics planejam começar com vinte e cinco mil robôs Atlas nas fábricas da Hyundai e da Kia (anúncio do RMAC citado na referência
    jHb70I1Zqiw)'
  nota: 8
  destino: 'https://inematds.github.io/HG1/ (HG1: Academia de Humanoides, 7 tiers, 70+ módulos, 100% gratuito, no inema.club)'
  fatos:
  - 'Hyundai/Boston Dynamics (transcrição da referência jHb70I1Zqiw, src/transcript.txt): ''Boston Dynamics'' RMAC announcement describes plans that begin with 25,000 Atlas robots across Hyundai Motor and
    Kia plants worldwide. That is a plan for the coming years, rather than a headcount of robots already on the job.'' e ''Hyundai is targeting parts sequencing at Metaplant America beginning in 2028.'''
  - 'Hyundai e empregos (mesma transcrição): ''Many viewers will also wonder what this means for factory jobs. The plan starts with repetitive parts handling, and Hyundai hasn''t said how many human roles
    will change'' — por isso a fala só PERGUNTA ''e se…'', não afirma demissão'
  - 'Figure 03 (mesma transcrição, relato do CEO da Figure): ''The robot ran over eight days, 200 hours straight, no breaks. Every time I needed a battery charge, it would swap the robot behind it. That
    record relied on swaps, so no single battery lasted 200 hours.'' — tarefa de separação de pacotes (roteiro/pt.json: ''o Figure zero três aparece em tarefas de separação de pacotes... uma operação continuou
    por cerca de duzentas horas... os robôs eram trocados quando precisavam carregar'')'
  - 'Tesla Optimus (mesma transcrição): ''Elon Musk called Optimus the hardest product to scale manufacturing that we''ve ever made at Tesla'' — a corrida é para fabricar em escala'
  - 'Boston Dynamics (mesma transcrição): ''Mark DiLeo, who leads Atlas Service and Repair, says the production version was made to be serviced in a customer environment'' e ''Repairs have to be quick because
    a company running a large fleet cannot treat every breakdown like a research project'' — a fábrica com robôs precisa de gente que opera e conserta'
  - 'HG1: Academia de Humanoides, página https://inematds.github.io/HG1/ (conferida 28/10/2026): ''7 Tiers Progressivos • 70+ Módulos • 100% Gratuito''; tiers ''Tier 1.0 Conhecendo Humanoides'' (✓ Principais
    modelos (Unitree, Tesla, Figure)), ''Tier 2.0 Operando Humanoides'' (✓ Interfaces de controle ✓ Segurança e melhores práticas ✓ Simuladores (Gazebo, Isaac Sim)) e ''Tier 3.0 Programando Humanoides''
    (✓ Python e ROS2 avançado ✓ Visão computacional e IA)'
  - 'Área Robot do INEMA, https://eventos.inema.pro/robot/ (conferida 28/10/2026): ''Tesla Optimus, Unitree e Figure saíram do vídeo de demonstração e começam a entrar em fábricas. Estes dois cursos [HG1
    e FTH], em português, mostram como eles funcionam e como programar um em simulador, sem comprar o robô.'' e ''7 cursos abertos'''
