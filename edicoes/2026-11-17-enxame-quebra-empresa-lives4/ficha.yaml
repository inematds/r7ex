       gatilho: "perda concreta em primeira pessoa + promessa de conserto"}
    - {canal: "KodeKloud", titulo: "The Real Cost of AI Agents in 2026 (Token Prices vs the Loop)",
       abertura: "(sem legenda; título) o custo real é o laço",
       gatilho: "custo escondido, fraco sem número"}

marca: "INEMA · AGENTES"
selo: "CUSTO ESCONDIDO"
fonte: "<b>Anthropic</b> · How we built our multi-agent research system, jun/2025 · caso interno INEMA, nov/2026 · imagens: ilustração"

abertura:
  cor: amarelo
  cena: "prédio de escritório de vidro à noite sendo devorado por um enxame de pequenos robôs dourados, como formigas
    arrancando a fachada; uma janela acesa com um executivo de costas segurando uma fatura de papel comprida que
    desce até o chão; preto e amarelo, luz de cinema"

trocas:
  "quinze vezes": "15×"
  "doze mil": "12 mil"

partes:
  - etapa: gancho
    fala: "Você pensou em montar um enxame de agentes? A Anthropic mediu: gasta quinze vezes mais que um chat. A ideia é genial. A conta, não."
    prende: "contradiz o viral do enxame com um número que dói; a frase curta 'a conta, não' abre a pergunta: quanto?"
    painel:
      de: "15×"
      k: "ANTHROPIC · JUN/2025"
      borda: red
      contador: {ate: 15, em: "15×", cor: "#ff2a1f", unid: "× MAIS TOKENS QUE UM CHAT"}
      l: "sistema multiagente × conversa"
  - etapa: medo
    fala: "Cada agente lê tudo, fala com outro, refaz. E a fatura vem pra você. Não é erro seu."
    prende: "mostra onde o dinheiro some e tira a culpa de quem acreditou no vídeo; 'o viral não mostra a fatura' é a revelação"
    imagem: "uma impressora de escritório cuspindo uma fatura de papel infinita que cai em cascata até o chão escuro,
      pequenos robôs dourados empurrando o papel; luz vermelha de alerta no papel; um único assunto, fundo preto"
    lista:
      k: "ONDE O DINHEIRO SOME"
      borda: red
      itens: [["lê", "📚 cada agente lê tudo de novo"], ["fala", "💬 agente falando com agente"], ["refaz", "🔁 retrabalho"]]
    painel:
      titulo: "O VIRAL ESCONDE A FATURA"
      cor: "#ff2a1f"
  - etapa: desejo
    fala: "E se uma equipe de agentes trabalhasse por você, sem susto na fatura?"
    prende: "vira a chave do medo para o desejo: a pessoa quer o poder, só não quer quebrar"
    imagem: "um único robô dourado humanoide de visor preto em pé, calmo, segurando uma calculadora acesa em amarelo,
      contraluz recortada, fundo preto liso; sensação de controle"
    painel:
      titulo: "SEM SUSTO NA FATURA"
      cor: "#FACC15"
  - etapa: facilidade
    fala: "O jeito é a Ficha do Enxame: um agente primeiro, mais só quando a tarefa pede."
    prende: "derruba o 'isso é coisa de engenheiro': é uma regra que qualquer um aplica amanhã"
    diagrama:
      forma: fluxo
      titulo: "ENXAME SOB DEMANDA"
      nos:
        - {de: "Ficha", ic: "📋", txt: "Ficha do Enxame", sub: "antes de chamar agentes"}
        - {de: "agente", ic: "🤖", txt: "Um agente primeiro", sub: "começa sozinho"}
        - {de: "pede", ic: "❓", txt: "Mais só se a tarefa pede", sub: "cada um com limite", cor: vd}
    painel:
      titulo: "UM AGENTE PRIMEIRO"
      cor: "#22c55e"
  - etapa: descoberta
    fala: "Um processo nosso sem trava bateu no limite doze mil vezes. Por isso a ficha tem limite e hora de parar."
    prende: "dá nome ao método e prova com um caso real da casa, sem vergonha de mostrar o erro"
    print:
      url: "https://inematds.github.io/enxame-antigravity/guia/"
      selo: "FICHA DO ENXAME · KIT GRÁTIS"
    painel:
      de: "12"
      k: "CASO INEMA · NOV/2026"
      borda: red
      contador: {ate: 12619, em: "12", cor: "#ff2a1f", unid: "RECUSAS EM 34 H"}
      l: "processo sem trava de cota"
  - etapa: beneficio
    fala: "A Anthropic avisa: enxame só vale se o resultado paga."
    prende: "máxima curta, com autoridade de quem vende o modelo; a pessoa repete e compartilha"
    logos: [{id: anthropic, nome: Anthropic}]
    imagem: "uma balança antiga de metal: de um lado uma lâmpada acesa em amarelo, do outro uma pilha de moedas
      pesando mais e afundando; luz de cinema lateral, um único assunto, fundo preto, sem letras"
    painel:
      titulo: "SÓ VALE SE O RESULTADO PAGA"
      cor: "#FACC15"
  - etapa: comentario
    fala: "Toda semana tem kit novo, grátis, no inema ponto club. Vai montar o enxame ou medir primeiro?"
    prende: "pertencimento + pergunta que a pessoa responde com a própria experiência; quem nunca mediu se reconhece"
    print:
      url: "https://inematds.github.io/enxame-antigravity/guia/"
      selo: "KIT ENXAME · GRÁTIS"

