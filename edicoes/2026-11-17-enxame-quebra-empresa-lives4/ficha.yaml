slug: enxame-quebra-empresa-lives4
tema: "Enxame de agentes pode quebrar sua empresa: a ideia é genial, a conta não"
pedido: "Nei (17/11/2026): vai com o prédio e faz o r7ex no lives4 (inema.agentes). Tese: enxames de agentes quebrando
  uma empresa; a ideia é genial mas o custo é proibitivo, a menos que você esteja ganhando muito com isso. Gancho
  aprovado: 'A ideia é genial. A conta, não.' Imagem de abertura aprovada: prédio de vidro devorado por enxame de robôs."
plano:
  pessoa: "quem vê vídeo viral de enxame de agentes e pensa em montar um no trabalho ou na empresa"
  quer: "usar o poder de vários agentes sem ver a conta explodir (dor) e saber quando vale a pena (desejo)"
  gancho: "estatística com fonte: a própria Anthropic mediu que sistema multiagente gasta cerca de 15 vezes mais tokens que um chat"
  nota: 9
  destino: "https://inematds.github.io/enxame-antigravity/guia/"
  fatos:
    - "Anthropic, 'How we built our multi-agent research system' (jun/2025): 'agents typically use about 4× more tokens
      than chat interactions, and multi-agent systems use about 15× more tokens than chats'."
    - "Mesmo texto da Anthropic: 'For economic viability, multi-agent systems require tasks where the value of the task
      is high enough to pay for the increased performance.'"
    - "Mesmo texto: o sistema multiagente superou o agente único em 90,2% na avaliação interna de pesquisa — ou seja,
      funciona, mas custa (não dizemos que é ruim; dizemos que só vale quando o resultado paga)."
    - "Caso interno INEMA (lote-135, 15–16/11/2026): um processo automático solto chamava a IA sem trava de cota e
      recebeu 12.619 recusas por limite em cerca de 34 horas (~400 por hora), sem parar no primeiro erro; a revisão
      ficou parada nesse tempo. Corrigido em 17/11/2026 com trava de cota."
    - "Kit gratuito enxame-antigravity (guia em inematds.github.io/enxame-antigravity/guia/): Ficha do Enxame com
      dono por pedaço, quem confere, limite de workers, parar quando a cota acabar e nada de laço sem supervisão."
gancho:
  tipo: estatistica
  manchete: "ENXAME DE AGENTES PODE QUEBRAR SUA EMPRESA"
  destaque: "QUEBRAR"
  objeto: "um prédio de escritório de vidro à noite sendo devorado por um enxame denso de pequenos robôs dourados que
    arrancam pedaços da fachada como formigas; uma única janela acesa com um executivo segurando uma fatura comprida"
  entrega: "por que o enxame custa tanto e a regra simples para só chamar mais agentes quando o resultado paga a conta"
  prova: {parte: 1, de: "15×"}
  absolvicao: "Não é erro seu"
  fontes:
    - {nome: "Anthropic, How we built our multi-agent research system, jun/2025",
       trecho: "multi-agent systems use about 15× more tokens than chats"}
  referencias:
    - {canal: "Tech With Tim", titulo: "I Unleashed 100 AI Agents at Once. Here’s What Happened.",
       abertura: "Same AI model, same 563 problems. One agent alone got 26% right, but a swarm of agents got 71%.",
       gatilho: "número antes/depois, promessa do enxame (o lado que nós contradizemos)"}
    - {canal: "Devsplainers", titulo: "Why Your AI Coding Bill Is About to Explode",
       abertura: "Last month, the bill for your work was $39. This month, it's 942. That's like 24 times more overnight.",
       gatilho: "perda concreta no bolso + número antes/depois"}
    - {canal: "Coding with Jan", titulo: "I Wasted Hundreds on AI Agents. These 3 Fixes Stopped It.",
