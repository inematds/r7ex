publicar:
  fila: lives4
  titulo: "Enxame de agentes pode quebrar sua empresa: a ideia é genial, a conta não #shorts"
  contexto: "R7EX INEMA (Nei Maldaner), canal inema.agentes. Contraponto aos vídeos virais de enxame de agentes: a
    própria Anthropic mediu que sistemas multiagente gastam cerca de 15 vezes mais tokens que um chat e diz que só
    compensam quando o valor da tarefa paga o custo (How we built our multi-agent research system, jun/2025). O
    dinheiro some em contexto repetido, conversa entre agentes e retrabalho. Regra: enxame sob demanda — um agente
    primeiro, mais agentes só quando a tarefa pede, cada um com limite. Método: Ficha do Enxame, kit grátis em
    https://inematds.github.io/enxame-antigravity/guia/. Caso real INEMA nov/2026: processo sem trava de cota com mais
    de 12 mil recusas por limite em ~34 h. Publicação pedida pelo Nei no lives4 em 17/11/2026."
