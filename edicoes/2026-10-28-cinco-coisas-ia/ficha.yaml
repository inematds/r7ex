    fala: "Um: as Skills do Claude, uma pasta por tarefa. Dois: o ponytail, que corta código inútil. Três: o Understand Anything, que mapeia seu sistema. Quatro: o é cê cê, um time de agentes. E cinco: o Roadster da Tesla, por ora só na demonstração."
    prende: "a lista prometida no gancho, uma descoberta a cada três segundos acendendo no mapa; a quinta fecha a curiosidade do carro com a verdade (só demonstração)"
