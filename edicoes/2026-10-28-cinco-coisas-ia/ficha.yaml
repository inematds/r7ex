      de: corrigindo
      k: "VOCÊ, HOJE"
      borda: red
      titulo: "CORRIGINDO NO CHAT"
      cor: "#ff2a1f"
  - etapa: desejo
    fala: "Imagina explicar uma vez só, e ela fazer do seu jeito sempre."
    prende: "o desejo de não repetir a mesma explicação toda vez"
    imagem: "um único notebook aberto numa mesa preta trabalhando sozinho, a tela acesa em amarelo com linhas que se escrevem sozinhas, uma cadeira vazia afastada, sob um foco de luz amarela vindo de cima; fundo preto liso; metade de baixo vazia; sensação de alívio; nenhum texto legível na tela"
    painel:
      de: jeito
      k: "O QUE VOCÊ QUER"
      borda: am
      titulo: "DO SEU JEITO"
      cor: "#FACC15"
  - etapa: facilidade
    fala: "Ela não é burra, só não sabe o seu trabalho. E montar a pasta não exige programar."
    prende: "tira a culpa da pessoa e da IA ao mesmo tempo e derruba o 'não sou técnico' (só para a pasta, que é texto; os plugins são para quem mexe com código)"
    imagem: "um único robô humanoide industrial estilo Tesla Optimus, painéis brancos e visor preto oval, sentado numa mesa escura recebendo nas mãos uma pasta de arquivo amarela iluminada, a luz da pasta subindo para o visor, sob um foco de luz amarela de cima; fundo preto liso; metade de baixo vazia; sensação de aprender"
