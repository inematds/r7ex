publicar:
  fila: lives11
  titulo: "5 coisas de IA deste mês que quase ninguém percebeu #shorts"
  contexto: "Short vertical do INEMA.CLUB (Nei Maldaner), canal INEMA Futuros: 5 coisas de IA de outubro de 2026 que quase ninguém percebeu. 1) Um agente só com uma pasta por tarefa (a lógica das Agent Skills do Claude): quando a IA errar, não corrija no chat, corrija a pasta. 2) ponytail, plugin aberto no GitHub (~179 mil estrelas) que faz a IA escrever menos código e reaproveitar o que já existe. 3) Understand Anything, plugin grátis para Claude Code que desenha o mapa do seu sistema (explicação em inglês; a primeira leitura gasta token). 4) ECC (Everything Claude Code), um setup pronto com time de agentes, skills e memória, que venceu um hackathon. 5) O novo Tesla Roadster com propulsores, apresentado em 15/10/2026 num campo de testes da SpaceX — por enquanto só na demonstração. Curso Claude como gestor de agentes, 8 aulas, aberto e gratuito: https://inematds.github.io/claude-gestor-de-agentes-v72/ (inema.club). Não citar nenhum criador nem perfil de onde as ideias vieram; não inventar números além das estrelas do GitHub. CTA: comente qual das 4 ferramentas você vai usar primeiro (o número) ou peça o link."
