    - "Agent Skills: a pasta é texto (um SKILL.md com instruções, modelos e checklist em linguagem comum), não precisa de código — documentação de Agent Skills da Anthropic"
    - "ponytail: github.com/DietrichGebert/ponytail, ~179 mil estrelas (GitHub, conferido 28/10/2026); descrição: 'faz o agente pensar como o sênior mais preguiçoso da sala. O melhor código é o que você nunca escreveu'"
