partes:
  - etapa: gancho
    fala: "Cinco coisas de IA mudaram este mês e quase ninguém viu. Uma é um carro com propulsores, testado na SpaceX."
    prende: "número + 'quase ninguém percebeu' (medo de ficar de fora) + um carro com propulsores, difícil de ignorar: a pessoa quer ver a lista"
  - etapa: medo
    fala: "Quanto do dia você passa corrigindo a IA no chat? Tem gente que já deixa ela trabalhar sozinha."
    prende: "acusa o hábito de quase todo mundo (corrigir no chat) e mostra quem já passou na frente"
    imagem: "uma única janela de chat iluminada flutuando no escuro, cheia de linhas riscadas em vermelho, ficando pequena enquanto um feixe de luz vermelha #ff2a1f passa por ela em velocidade e vai embora, sob um foco vermelho de cima; fundo preto liso; metade de baixo vazia; sensação de ficar para trás"
