# Ficha r7ex — 'A IA da OpenAI vai quebrar os sistemas dos bancos' (22/10/2026). Par do r7exp ~/projetos/r7exp/bancos.
slug: openai-bancos
tema: 'A IA da OpenAI vai quebrar os sistemas dos bancos (COBOL: de 5% a 98% no teste) — e as empresas gigantes são as próximas'
pedido: 'Nei, 22/10/2026: "quero criar um video r7exp [...] e faz outro tambem r7ex, coloque os dois videos no lives8 inema.dev". Gatilho dado
  pelo Nei: título "A IA da OPENAI Vai QUEBRAR os Sistemas dos BANCOS e das Empresas Gigantes!"; QUEBRAR é o gancho, depois explica que não é
  derrubar bancos, é quebrar a dependência de tecnologia antiga; fecha em "pense na sua empresa" (custo de manter, tecnologia antiga, dependência
  do fornecedor) e no caminho: entender, identificar riscos, testar com IA, transformar aos poucos.'
plano:
  pessoa: empresário e gestor comum (não programador) que usa banco todo dia e tem um sistema antigo na empresa
  quer: entender se o dinheiro dele corre perigo (medo) e se a mudança pode baratear e libertar o sistema da empresa dele (desejo)
  gancho: 'provocação + número: ''a IA da OpenAI vai quebrar os sistemas dos bancos'' — num teste saiu de 5% para quase 98%'
  nota: 8
  destino: https://inematds.github.io/ws2ia/
  fatos:
  - 'OpenAI, pesquisa de 19/10/2026 (linguagens de poucos dados): teste estrito de migração de programas COBOL para linguagem moderna (C++, Java,
    Kotlin, Python, Rust); toda saída tinha que bater igual, até o último byte'
  - 'GPT 5.6 Soul: 5,4%; GPT 6.1 Soul no mesmo nível: 86,6% (custando ~61% do anterior); com mais raciocínio: 97,9%'
  - 'segundo a OpenAI, o COBOL ainda está por trás de 40% do banco online, 80% das transações presenciais com cartão e 95% das transações em caixa
    eletrônico; estimativa da Reuters: ~220 bilhões de linhas em produção'
  - 'COBOL foi criado em 1959: "a 60-year-old language" na própria apresentação da pesquisa (mais de 60 anos)'
  - programadores de COBOL estão se aposentando (pesquisa Computerworld 2012; em 2020 estados dos EUA pediram programadores COBOL em público)
  - 'COBOL corta as casas decimais; muitas linguagens modernas arredondam: o programa roda sem erro e o total sai diferente'
  - 'a própria OpenAI diz: o teste é dela e privado; uso em produção ainda precisa de revisão de especialista e testes com as regras de cada empresa'
  - 'Workshop Avançado de Engenharia de Software com IA (inema.club, ws2ia): inclui modernização de legado'
marca: INEMA · IA NOS BANCOS
selo: ALERTA INEMA
fonte: '<b>OpenAI</b>, pesquisa 19/10/2026 (teste da própria OpenAI, privado) · <b>Reuters</b> (estimativa de linhas COBOL) · imagens: ilustração'
