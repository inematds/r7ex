    de: 98%
    borda: am
- etapa: medo
  fala: O sistema que mexe no seu dinheiro tem mais de sessenta anos e passa por quase todo saque no caixa.
  prende: 'traz para o bolso da pessoa: o saque dela de hoje passou por um sistema de 60 anos'
  imagem: um caixa eletrônico antigo numa parede escura, a tela verde de fósforo com linhas de código velho brilhando, rachaduras finas se espalhando
    pelo metal; luz vermelha recortando a máquina, fundo preto liso, metade de baixo vazia; sensação de algo velho segurando tudo
  painel:
