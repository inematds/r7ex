      - 📅 COBOL, de 1959
    - - saque
      - 🏧 95% dos saques no caixa
- etapa: prova
  fala: Quem sabe mexer nele está se aposentando. Num teste, a IA reescreveu esse código e a conta bateu até o centavo.
  prende: medo (ninguém sabe mexer) virando descoberta (a IA faz) com detalhe concreto do centavo
  imagem: um braço de robô humanoide estilo Optimus de visor preto segurando uma única moeda brilhante entre os dedos de metal, encaixando-a numa
    pilha perfeita de moedas; luz amarela forte de cima na moeda, fundo preto liso, metade de baixo vazia; sensação de precisão absoluta
  lista:
