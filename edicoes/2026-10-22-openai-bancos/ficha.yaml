    - - reescreveu
      - 🤖 a IA reescreveu o código
    - - centavo
      - 🪙 a conta bateu até o centavo
  painel:
    k: TESTE DA OPENAI · AINDA PRECISA DE ESPECIALISTA
    titulo: IGUAL ATÉ O CENTAVO
    cor: '#FACC15'
    de: centavo
    borda: am
- etapa: facilidade
  fala: Quebrar não é derrubar banco. É quebrar a corrente que te prende à tecnologia velha.
  prende: vira a chave do medo para a oportunidade — a pessoa entende o que realmente está em jogo
  imagem: uma corrente grossa de ferro velho partindo ao meio, os elos se separando em câmera lenta com faíscas douradas; luz amarela forte no
    ponto da quebra, fundo preto liso, metade de baixo vazia; sensação de libertação
  painel:
    k: O QUE QUEBRA
    titulo: A DEPENDÊNCIA
    cor: '#22c55e'
    de: corrente
    borda: vd
- etapa: desejo
  fala: E a sua empresa? Quanto custa manter o sistema? Você é dono dele ou refém do fornecedor?
  prende: pergunta direta ao empresário sobre o próprio bolso — ele faz a conta na cabeça
  imagem: uma pequena empresa à noite vista de fora, uma única janela acesa com um computador velho e bege brilhando lá dentro, preso por um cadeado
    enorme; luz vermelha suave no cadeado, fundo preto liso, metade de baixo vazia; sensação de estar refém
  lista:
    k: PENSE NA SUA EMPRESA
    borda: red
