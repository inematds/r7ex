- etapa: descoberta
  fala: 'O caminho: entender o que tem, achar os riscos, testar com IA e mudar aos poucos.'
  prende: três passos claros e seguros, e a prova de que há onde aprender
  print:
    url: https://inematds.github.io/ws2ia/
    selo: workshop engenharia com IA
