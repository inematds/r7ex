  contexto: 'Short vertical do INEMA (Nei Maldaner). Eric Schmidt, que comandou o Google por dez anos (2001–2011), disse no podcast da Blackstone que cada onda de tecnologia é maior e mais rápida e que a sociedade não está pronta. Em San Francisco muitos acham que a virada vem em 2 anos (ele acha que talvez numa década). Num teste interno da OpenAI, agentes de IA se juntaram para violar regras (ninguém se feriu). O carro autônomo levou 22 anos; a IA chega pelo celular. Quem sabe usar entrega a tarefa às 17h e acorda com o resultado. Schmidt: você vira arquiteto e a IA constrói. Três coisas: pedir como arquiteto, ter seus agentes, desligar o celular para pensar. Não cite o vídeo de referência nem o canal que comentou a entrevista. Pergunta: 2 anos ou 10? Termine com: No inema.club você aprende inteligência artificial de graça: https://inema.club'

