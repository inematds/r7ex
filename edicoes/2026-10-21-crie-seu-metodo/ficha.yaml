      cor: "#ff2a1f"
  - etapa: medo
    fala: "Um agente copia quase qualquer software, e automação sai em minutos. Quem paga por isso?"
    prende: "prova concreta do medo (clonar software, automação em minutos): quem vende automação sente que o preço dele está caindo"
    imagem: "um cubo de vidro luminoso, como um software, se partindo e soltando de dentro uma cópia idêntica dele mesmo, as duas metades se separando no ar sob um foco de luz vermelha #ff2a1f vindo de cima; estilhaços finos de vidro; fundo preto liso; sensação de ser copiado"
