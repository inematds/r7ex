      k: "O QUE BARATEOU"
      borda: red
      itens: [[copia, "🔍 engenharia reversa de quase tudo"], [automação, "⏱️ automação sai em minutos"], [paga, "📉 vender isso solto ficou barato"]]
    painel:
      de: paga
      k: "FICOU BARATO"
      borda: red
      titulo: "VENDER SÓ AUTOMAÇÃO?"
      cor: "#ff2a1f"
  - etapa: desejo
    fala: "Não é culpa sua. Imagina montar uma vez e vender pra clínica, imobiliária e escritório."
    prende: "virada do medo para o desejo: algo que a IA nova não apaga e que se vende de novo em cada cliente"
    imagem: "um carimbo pesado de metal escuro descendo com força e marcando a mesma forma dourada luminosa numa superfície preta, com faíscas amarelas saindo da borda no impacto, sob um foco de luz amarela de cima; fundo preto liso; sensação de algo que se repete igual"
    lista:
      k: "O MESMO MÉTODO EM"
      borda: am
      itens: [[clínica, "🏥 na clínica"], [imobiliária, "🏠 na imobiliária"], [escritório, "🏢 no escritório"]]
    painel:
