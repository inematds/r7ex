      k: "MUDA O ÂNGULO"
      borda: am
      titulo: "A ESTRUTURA FICA"
      cor: "#FACC15"
  - etapa: facilidade
    fala: "No método, a equipe pede ao agente e você só aprova. A IA nova só acelera isso."
    prende: "derruba o 'não tenho tempo': o dono sai do meio dos pedidos; diagrama simples de 3 caixas que se entende num olhar"
