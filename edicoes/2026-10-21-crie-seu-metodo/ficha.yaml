        - {de: vendedor, ic: "🎯", txt: "Vendedor", sub: "abre perguntando", cor: vd}
  - etapa: beneficio
    fala: "Sai um modelo novo e você acelera. Aí você sabe que tem método."
    prende: "fecha o gancho (apaga × acelera) com alívio; prova real com a página da aula do teste do modelo novo"
    print: {url: "https://inematds.github.io/crie-seu-metodo-v72/aulas/criterio/", selo: "aula 7 · o critério"}
    painel:
