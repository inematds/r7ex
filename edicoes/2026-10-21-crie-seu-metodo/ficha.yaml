    fala: "Seu anúncio promete uma coisa e o vendedor outra: o cliente some. O segredo: a mesma dor do começo ao fim."
    prende: "o nome da solução com número (13 peças) e o segredo revelado: a mesma dor em quatro lugares, que quase ninguém faz"
