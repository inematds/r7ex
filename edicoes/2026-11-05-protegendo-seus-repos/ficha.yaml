  prende: 'o medo fica concreto (um robô decide) e derruba a saída óbvia (outra conta), com absolvição na hora'
  imagem: 'uma única pasta de arquivos de código sendo puxada para dentro de um cofre de aço que se fecha, a porta do cofre batendo, sob um foco de luz vermelha #ff2a1f de cima; fundo preto liso; metade de baixo vazia; sensação de perder o acesso ao que é seu; nenhum texto legível; o centro da imagem livre para um logo'
