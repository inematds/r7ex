  titulo: 'O GitHub bloqueou sua conta. Você perdeu tudo? #shorts'
  contexto: 'Short vertical do INEMA.CLUB (Nei Maldaner), canal INEMA FTD. Gancho de perda: e se o GitHub bloquear a sua conta amanhã (denúncia, robô antifraude, engano de política) e você não conseguir nem baixar o que é seu? Outra conta no GitHub não salva: é a mesma empresa, e numa invasão quem pega os tokens apaga o original e a cópia. Solução: backup em 3 camadas — cópia no GitLab (outra empresa, conta sem vínculo, token que envia mas não apaga), fotos datadas no disco local (volta a qualquer dia) e teste de restauração. Máxima: ''Backup que você nunca testou não é backup.'' Guia completo: https://inematds.github.io/protegendo-seus-repos/guia/ (inema.club). Não inventar números. CTA: comente ''eu vou'' ou peça o link.'
