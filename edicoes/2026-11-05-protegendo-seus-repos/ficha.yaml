  prende: 'derruba "não sou técnico" e "não tenho tempo" de uma vez: roda sozinho'
  imagem: 'um único HD externo preto ligado num notebook, com uma luz amarela piscando enquanto copia, sob um foco de luz amarela de cima; fundo preto liso; metade de baixo vazia; sensação de algo automático e tranquilo; nenhum texto legível'
