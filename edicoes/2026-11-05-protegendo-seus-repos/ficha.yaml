slug: protegendo-seus-repos
tema: 'Se a sua conta do GitHub sumir amanhã, você perde tudo? Backup em camadas dos repositórios git'
pedido: 'Nei, 05/11/2026: página-projeto "protegendo seus repos" + portal + Telegram INEMA.DEV + explicavideo no lives3 + "um r7ex". Tese: outra conta no GitHub não salva; backup em camadas
  (outra empresa, conta sem vínculo, token que não apaga) + fotos datadas no disco + teste de restauração; tá tudo no inema.club. Sem citar fonte, nada sensível.'
plano:
  pessoa: quem guarda trabalho no GitHub (dev, criador de conteúdo, professor, pequena empresa) e nunca pensou no dia em que a conta é bloqueada ou invadida
  quer: não perder anos de código num bloqueio ou numa invasão (dor) e ter tudo de volta no mesmo dia (desejo)
  gancho: 'perda hipotética: a conta do GitHub bloqueada amanhã (denúncia, robô antifraude, engano de política) e você não consegue nem baixar o que é seu'
  nota: 8
  destino: 'https://inematds.github.io/protegendo-seus-repos/guia/ (guia Protegendo seus repos, no inema.club)'
  fatos:
  - 'VISAO.md §1: ''Bloqueio da conta. Uma denúncia, um robô antifraude, um engano de política. A conta fica suspensa e você não consegue nem baixar o que é seu.'''
  - 'VISAO.md §1: ''Invasão. Alguém pega um token ou a senha e apaga repositórios, ou reescreve o histórico com um push --force.'''
  - 'VISAO.md §2: ''Por que outra conta do GitHub protege pouco'' — bloqueio: ''É a mesma empresa. Se as contas estão ligadas (mesmo e-mail, mesmo telefone, mesma máquina), a revisão pode alcançar as duas.''; invasão: ''Se a mesma máquina tem os tokens das duas contas, quem invade pega os dois e apaga o original e a cópia.'''
  - 'VISAO.md §4 Camada 1: ''GitLab, numa conta sem vínculo'' — ''Outra empresa. Um bloqueio no GitHub não chega lá.'' e ''Token só de envio... sem permissão de apagar projetos. Quem invadir a máquina não consegue apagar a cópia.'''
  - 'VISAO.md §4 Camada 2: ''Todo dia um timer atualiza um espelho completo de cada repo num disco local'' e ''tira uma foto daquele dia'' — ''Um repo apagado ou estragado no GitHub não apaga as fotos antigas. Você volta ao dia que quiser.'''
  - 'VISAO.md §4 Restaurar: ''a parte que todo mundo esquece de testar'' — ''Teste a volta antes de precisar dela: escolha 3 repos, restaure num lugar novo e compare.'''
  - 'VISAO.md §3: regra 3-2-1 (3 cópias, 2 lugares, 1 fora de casa) e ''pelo menos uma cópia que a sua máquina do dia a dia não consegue apagar.'''
