  contexto: "Short vertical do INEMA.CLUB (Nei Maldaner), da série 5 futuros da IA. A mudança já começou: Stanford Digital Economy Lab mediu jovens nas funções mais expostas à IA 19% abaixo no emprego. Daqui até 2050, 5 caminhos (mapa do Life 3.0, de Max Tegmark, adaptado; cenários, não previsão): extinção total, zoológico humano (vive bem mas não decide), governo mundial da IA, paraíso feito pela IA e utopia verdadeira (você com uma equipe de agentes). Não é a tecnologia que decide, é quem se prepara. 3 passos: usar a IA nas tarefas reais, ter uma IA no próprio computador, construir algo seu. Kit aberto e gratuito sobreviver-ia em https://inematds.github.io/sobreviver-ia/guia/ (no inema.club). Playlist 5 futuros no canal. CTA: qual futuro você escolhe?"
