# Ficha r7ex — 5 futuros: o que vai acontecer e qual você escolhe (28/10/2026).
# Fatos: ~/projetos/r7exp/completo/ficha.yaml (AI 2027, Stanford) + ~/projetos/cinco-futuros/kit/estado/sinais.md (Epoch).
slug: cinco-futuros-escolha
tema: "O mundo vai mudar e já começou: cinco caminhos até 2050 — qual você escolhe?"
pedido: "Nei, 28/10/2026: 'refaca outro video 9x16 mostrando o q vai acontecer e os cincos cenariso com chmadas impactantes e os graficos' e depois 'refaca ele usando o rtex rtexjp e r7ex e r7exp publique no lives11 na fila, e manda todos no v3'. Playlist 5 futuros (PLGR_G3hBAAaM)."

plano:
  pessoa: "público geral que ouve falar de IA e não sabe se deve ter medo ou esperança"
  quer: "entender o que pode acontecer e ficar do lado bom (medo + desejo)"
  gancho: "estatística: Stanford mediu jovens nas funções mais expostas à IA 19% abaixo no emprego — a mudança já começou; daqui saem 5 caminhos até 2050"
  nota: 8
  destino: "https://inematds.github.io/sobreviver-ia/guia/ (kit aberto e gratuito no inema.club)"
  fatos:
    - "Stanford Digital Economy Lab: jovens nas funções mais expostas à IA 19% abaixo no emprego (usado no completo 5 futuros B, publicado no lives1)"
    - "mapa dos 5 futuros (Life 3.0, Max Tegmark, adaptado): extinção total, zoológico humano, governo mundial da IA, paraíso feito pela IA, utopia verdadeira; até 2050; cenários, não previsão"
    - "zoológico humano = vivos e bem cuidados, mas sem decidir (completo 5 futuros, caminho 2)"
    - "utopia verdadeira = humanos e IA juntos; a Ana com uma equipe de agentes (completo, caminho 5)"
    - "completo, fala final: 'O que muda de um para o outro não é a tecnologia: é quem decide' + passos: IA nas tarefas reais, IA no próprio computador, construir algo seu"
    - "kit sobreviver-ia: aberto e gratuito (guia diz 'kit aberto')"

