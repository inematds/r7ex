  manchete: "SUA VAGA JÁ ESTÁ SUMINDO"
  destaque: "VAGA"
  objeto: "um crachá de trabalho de plástico rachado ao meio, com um risco vermelho atravessando, caindo no escuro"
  prova: {parte: 1, de: "19%"}
  absolvicao: "Não é culpa sua"
  fontes: [{nome: "Stanford Digital Economy Lab", trecho: "jovens nas funções mais expostas à IA 19% abaixo no emprego"}]

abertura:
  branco: "SUA VAGA JÁ"
  destaque: "ESTÁ SUMINDO"
  cor: amarelo
  cena: "manchete SUA VAGA JÁ ESTÁ SUMINDO (VAGA em amarelo) e embaixo, menor, 19% · STANFORD; no centro um crachá de trabalho de plástico rachado ao meio, com um risco vermelho #ff2a1f atravessando, caindo no escuro sob um foco de luz dura; fundo preto liso; metade de baixo vazia; sensação de perda"

fala_max: 800
fala_max_motivo: "o Nei pediu os 5 cenários: a parte 2 nomeia os cinco, cada um acendendo no mapa"

trocas:
  "dezenove por cento": "19%"
  "dois mil e cinquenta": "2050"
  "cinco caminhos": "5 caminhos"
  "caminho cinco": "caminho 5"
  "escolho o cinco": "escolho o 5"

partes:
  - etapa: gancho
    fala: "Se você é jovem, a IA já está pegando a sua vaga. Stanford mediu: dezenove por cento a menos de emprego."
    prende: "perda concreta + número com fonte forte (Stanford) logo nos primeiros segundos"
    painel:
      de: "19%"
      k: "STANFORD"
      borda: red
      contador: {ate: 19, em: "19%", cor: "#ff2a1f", unid: "ABAIXO NO EMPREGO"}
      l: "jovens nas funções mais expostas à IA"
  - etapa: medo
    fala: "Não é culpa sua: ninguém te mostrou o mapa. Até dois mil e cinquenta, são cinco caminhos. O pior: extinção. Zoológico humano, governo da IA, paraíso ou utopia."
    prende: "o mapa inteiro numa frase, cada cenário acendendo na palavra: a pessoa procura onde ela estaria"
    diagrama:
      forma: hub
      titulo: "5 CAMINHOS ATÉ 2050"
      centro: {de: caminhos, ic: "🛤️", txt: "2026 · ESTAMOS AQUI"}
      nos:
        - {de: extinção, ic: "💀", txt: "1 · extinção total"}
        - {de: zoológico, ic: "🦓", txt: "2 · zoológico humano"}
        - {de: governo, ic: "🏛️", txt: "3 · governo mundial da IA"}
        - {de: paraíso, ic: "🌴", txt: "4 · paraíso feito pela IA"}
        - {de: utopia, ic: "✨", txt: "5 · utopia verdadeira", cor: vd}
  - etapa: facilidade
    fala: "Em qual você vai estar? Você toparia ter tudo e nunca mais decidir nada?"
    prende: "pergunta incômoda do zoológico (conforto sem liberdade) + absolvição que alivia"
    imagem: "UMA mão humana aberta encostada por dentro num vidro grosso de uma jaula de vidro iluminada, como num zoológico, do lado de fora o reflexo do visor preto de um robô humanoide estilo Optimus observando; contraluz vermelho intenso recortando os dedos; fundo preto liso; sensação de prisão confortável; o assunto ENORME em primeiro plano na metade de cima, contraste extremo, luz de cinema dura; metade de baixo escura e vazia"
    painel:
      de: decidir
      k: "ZOOLÓGICO HUMANO"
      borda: red
      titulo: "CONFORTO SEM LIBERDADE"
      cor: "#ff2a1f"
  - etapa: desejo
    fala: "Agora o contrário: você decide, e uma equipe de IAs trabalha para você. Esse é o caminho cinco."
    prende: "o desejo concreto, o oposto do zoológico: você no comando"
    imagem: "UMA pessoa de costas numa mesa preta, à frente uma grande parede escura onde acendem vários pontos de luz amarela ligados a ela por fios de luz, como uma equipe trabalhando junto; foco de luz amarela dura de cima; fundo preto liso; sensação de comando; o assunto ENORME em primeiro plano na metade de cima, contraste extremo; metade de baixo escura e vazia; sem rosto"
    painel:
      de: equipe
      k: "UTOPIA VERDADEIRA"
      borda: am
      titulo: "VOCÊ NO COMANDO"
      cor: "#FACC15"
  - etapa: descoberta
    fala: "Não precisa ser técnico. Um: use a IA numa tarefa do seu trabalho. Dois: tenha uma IA sua, no seu computador. Três: construa algo seu."
    prende: "derruba o 'não sou técnico' e entrega 3 passos numerados, fáceis de fazer amanhã"
    diagrama:
      forma: fluxo
      titulo: "O SEU CAMINHO"
      nos:
        - {de: trabalho, ic: "🧪", txt: "IA no seu trabalho", sub: "meça o que ela já faz"}
        - {de: computador, ic: "💻", txt: "IA sua, no seu computador", sub: "não dependa de um dono"}
        - {de: seu, ic: "🏗️", txt: "construa algo seu", sub: "projeto, audiência, comunidade", cor: vd}
  - etapa: beneficio
    fala: "O que muda de um futuro para o outro não é a tecnologia. É quem decide. E a sua parte começa hoje."
    prende: "a máxima curta que a pessoa repete; vira o medo em poder de escolha"
    print: {url: "https://inematds.github.io/sobreviver-ia/guia/", selo: "kit aberto · inema.club"}
    painel:
      de: decide
      k: "QUEM DECIDE"
      borda: vd
      titulo: "VOCÊ"
      cor: "#22c55e"
  - etapa: comentario
    fala: "Qual futuro você vai construir? Comenta: eu escolho o cinco. Tá tudo no inema ponto club. Ou me pede o link aqui nos comentários."
    prende: "pergunta falada que puxa comentário + fecho padrão"
    print: {url: "https://inematds.github.io/sobreviver-ia/guia/", selo: "kit aberto e gratuito"}

