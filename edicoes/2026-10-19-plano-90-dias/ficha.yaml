        seu: "#FACC15", mínima: "#FACC15", preço: "#FACC15", lista: "#FACC15", teste: "#FACC15"}

publicar:
  fila: lives2
  titulo: "Teste de 3 segundos: se o seu salário parasse amanhã, o que continuaria rendendo? #shorts"
  contexto: "Short vertical do INEMA.CLUB (Nei Maldaner). Stanford Digital Economy Lab (Canaries in the Coal Mine): o emprego de 22 a 25 anos nas funções mais expostas à IA ficou 13%, depois 15% e, na versão de ago/2026, 19% abaixo das menos expostas — gap acumulado, por menos contratação. O teste: se o seu salário parasse amanhã, o que continuaria rendendo? Plano de 90 dias do projeto aberto sobreviver-ia: ter algo seu (versão mínima com IA em 2 semanas), mostrar para 5 pessoas e publicar 2 vezes por semana para montar a própria lista — o algoritmo muda, a lista fica. Não é recomendação financeira. No inema.club. CTA: passou no teste? comenta sim ou nada / peça o link."
