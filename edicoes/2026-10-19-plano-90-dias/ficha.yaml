publicar:
  fila: lives2
  titulo: "O emprego dos jovens só cai. Se o seu salário parar amanhã, como você sobrevive? #shorts"
  contexto: "Short vertical do INEMA.CLUB (Nei Maldaner). Stanford Digital Economy Lab (Canaries in the Coal Mine): o emprego de 22 a 25 anos nas funções mais expostas à IA ficou 13%, depois 15% e, na versão de ago/2026, 19% abaixo das menos expostas — gap acumulado, por menos contratação. A pergunta: se o seu salário parar amanhã, como você sobrevive? O que é teu que é valioso? Plano de 90 dias do projeto aberto sobreviver-ia: ter algo seu (versão mínima com IA em 2 semanas), mostrar para 5 pessoas e publicar 2 vezes por semana para montar a própria lista — o algoritmo muda, a lista fica. Não é recomendação financeira. No inema.club. CTA: comenta eu consigo, eu faço ou eu vou tentar / peça o link."
