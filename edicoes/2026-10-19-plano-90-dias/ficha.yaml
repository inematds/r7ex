# Ficha r7ex — plano de 90 dias: ter algo seu + distribuição (sobreviver-ia, semanas 3–8). Pedido do Nei (19/10/2026): "refaça outros 5 vídeos do r7ex ... mesmo avatar ... diversos lives, cada um com conteúdo diferente, e manda para o v3". Canal: lives2.
# Reescrita em 21/10/2026 com o texto do Nei (emoção primeiro, a verdade confirma na tela). Antes: portão D15: ângulo novo = "teste de três segundos" que o espectador responde nos comentários; a versão antiga (nota 7, sem 'prende') está em avatar/_antigo-2026-10-19/.
slug: plano-90-dias
tema: "O emprego dos jovens só cai — Stanford mediu 3 vezes e só piora. Se o seu salário parar amanhã, como você sobrevive?"

plano:
  pessoa: "assalariado que vende horas e não tem nada próprio além do emprego"
  quer: "não voltar pro zero se o emprego sumir (dor) e ter algo seu que rende sem ele estar lá (desejo)"
  gancho: "medo: Stanford Digital Economy Lab (Canaries in the Coal Mine) — o emprego de 22–25 anos nas funções mais expostas à IA está ~19% abaixo do que estaria se acompanhasse as menos expostas; o gap cresceu a cada versão do estudo: 13% → 15% → 19% (ago/2026)"
  nota: 8
  pedido: "Texto do Nei (21/10/2026), fixo: 1) o emprego dos jovens só cai, Stanford mediu 3 vezes e só piora, com gráfico caindo de impacto; 2) se o seu salário parar amanhã, como você sobrevive?; 3) o que é teu que é valioso?; 4) sem largar o emprego, você consegue construir e mostrar isso em 2 semanas; 5) mostre para 5 pessoas com um preço e publique 2 vezes por semana; 6) o algoritmo muda, a lista fica; 7) comenta: eu consigo, eu faço, eu vou tentar."
  destino: "https://inematds.github.io/sobreviver-ia/guia/#plano (plano de 90 dias, no inema.club, projetos)"
  fatos:
    - fato: "Stanford mediu 3 vezes (3 versões do estudo) e o gap subiu: 13% → 15% → 19% abaixo, emprego de 22 a 25 anos nas funções mais expostas à IA"
      trecho: "o Stanford Digital Economy Lab (\"Canaries in the Coal Mine\", atualização de agosto de 2026) mediu que o emprego de pessoas de 22 a 25 anos nas funções mais expostas à IA está cerca de 19% abaixo de onde estaria se tivesse acompanhado as funções menos expostas. É um gap acumulado, que cresceu entre as versões do estudo (13% → 15% → 19%)"
    - fato: "o teste: se o salário parasse amanhã, o que continuaria rendendo; se a resposta for nada, essa é a lacuna"
      trecho: "Exercício: se o seu salário parasse amanhã, o que continuaria gerando valor sem você estar lá? Se a resposta for \"nada\", essa é a lacuna destas semanas."
    - fato: "algo seu = produto pequeno, serviço com marca própria, curso; o que fica valioso é o que é seu"
      trecho: "A IA barateia o trabalho; o que fica valioso é o que é seu ... um produto pequeno, um serviço com marca própria, um modelo de documento, um curso, um pedaço de um negócio"
    - fato: "versão mínima em 2 semanas usando IA; mostrar para 5 pessoas"
      trecho: "Escolha uma e faça a versão mínima em 2 semanas, usando IA para ir mais rápido. Coloque um preço ou um pedido de contato e mostre para 5 pessoas."
    - fato: "publicar 2 vezes por semana; lista própria — o algoritmo muda, a lista fica; vai junto se trocar de emprego"
      trecho: "Distribuição é quem te conhece e confia em você ... Ela vai junto se você trocar de emprego ou de negócio. Publique 2 vezes por semana o que você está aprendendo no seu eval (é conteúdo pronto). Monte uma lista própria (e-mail ou grupo) — o algoritmo muda, a lista fica."
    - fato: "o plano não exige largar o emprego (é feito em semanas, junto com o trabalho atual) e não é recomendação financeira"
      trecho: "Este plano não é recomendação financeira. Ajuste ao seu momento. (semanas 1–2: tarefas reais do seu trabalho; semanas 3–5: versão mínima em 2 semanas)"

marca: "INEMA · 90 DIAS"
selo: "ALERTA INEMA"
fonte: "<b>Stanford Digital Economy Lab</b> · Canaries in the Coal Mine: emprego de 22–25 anos nas funções mais expostas à IA 13% → 15% → 19% abaixo (ago/2026) · plano: sobreviver-ia · imagens: ilustração"

abertura:
  branco: "O EMPREGO DOS JOVENS"
  destaque: "SÓ CAI"
  cor: vermelho
  cena: "um gráfico de linha enorme feito de neon vermelho despencando em três degraus sobre um fundo preto, cada degrau com um rótulo grande desenhado: -13%, -15%, -19%; o último trecho da linha racha e cai para fora do quadro; luz vermelha de alerta, sombras profundas, sensação de queda"

trocas:
  "duas semanas": "2 semanas"
  "cinco pessoas": "5 pessoas"
  "duas vezes": "2 vezes"

partes:
  - etapa: gancho
    fala: "O emprego dos jovens só cai. Stanford mediu três vezes, e só piora."
    prende: "medo direto em 2 segundos, com a marca Stanford; o contador na tela sobe até 19% e prova o que a fala sentiu"
    painel:
      de: Stanford
      k: "STANFORD · JOVENS DE 22 A 25 ANOS"
      borda: red
      contador: {ate: 19, em: "piora", cor: "#ff2a1f", unid: "% ABAIXO"}
      l: "13% → 15% → 19% · funções mais expostas à IA"
  - etapa: medo
    fala: "Agora pensa: se o seu salário parar amanhã, como você sobrevive?"
    prende: "pergunta que vira o dado para a vida de quem assiste; ninguém responde rápido, e a pessoa fica para ver a saída"
    imagem: "uma ampulheta de vidro antiga rachada, com a última areia escorrendo pela rachadura, fundo preto, luz vermelha forte de cima; sensação de fim; sem nenhum número, letra ou marca"
    lista:
      k: "SE O SALÁRIO PARAR"
      borda: red
      itens: [[salário, "💼 o salário parou"], [amanhã, "📅 amanhã"]]
    painel: {k: "E AGORA?", titulo: "COMO VOCÊ SOBREVIVE?", cor: "#ff2a1f", de: sobrevive, borda: red}
  - etapa: desejo
    fala: "Pensa comigo: o que é teu, que é valioso? Um serviço, um produto, aquilo que só você sabe fazer."
    prende: "pergunta que faz a pessoa olhar para si e achar valor; dá esperança logo depois do medo"
    imagem: "três objetos concretos lado a lado sobre uma mesa preta, sob um foco de luz forte de cima: uma pequena caixa de produto fechada, um cartão de visita em branco e um par de mãos trabalhando com uma ferramenta de artesão; sombras profundas; sem nenhuma letra, logo ou marca legível"
    lista:
      k: "O QUE É TEU"
      itens: [[serviço, "🛠️ um serviço"], [produto, "📦 um produto"], [sabe, "✨ o que só você sabe fazer"]]
    painel: {k: "PENSA COMIGO", titulo: "O QUE É TEU?", cor: "#FACC15", de: valioso}
  - etapa: facilidade
    fala: "E sem largar o emprego. Com a IA, você consegue construir isso e mostrar em duas semanas."
    prende: "derruba o 'não tenho tempo / não posso largar o emprego' e diz 'você consegue' com prazo curto"
    imagem: "uma pessoa vista de costas trabalhando num notebook à noite numa mesa simples de casa, a tela acesa iluminando o rosto de lado, ao lado um calendário de papel com 14 dias riscados; luz quente da tela, resto escuro; sem nenhuma letra legível na tela"
    lista:
      k: "SEM LARGAR O EMPREGO"
      itens: [[largar, "✅ sem largar o emprego"], [construir, "🧰 construir com IA"], [mostrar, "👀 e mostrar"]]
    painel: {k: "VOCÊ CONSEGUE", titulo: "2 SEMANAS", cor: "#FACC15", de: semanas}
  - etapa: descoberta
    fala: "Mostre para cinco pessoas com um preço e publique duas vezes por semana o que você está aprendendo."
    prende: "passos simples com número; mostrar já com preço soa real e dá para fazer nesta semana"
    diagrama:
      forma: fluxo
      titulo: "O PLANO DE 90 DIAS"
      nos:
        - {de: mostre, ic: "👥", txt: "Mostre para 5", sub: "pessoas reais"}
        - {de: preço, ic: "🏷️", txt: "Com um preço", sub: "ou um pedido de contato"}
        - {de: publique, ic: "📣", txt: "Publique 2×/semana", sub: "o que você está aprendendo", cor: vd}
  - etapa: beneficio
    fala: "E monte a sua lista: o algoritmo muda, a lista fica, e ela vai junto com você em qualquer emprego."
    prende: "frase curta e citável (o algoritmo muda, a lista fica) que dá vontade de compartilhar"
    imagem: "a mão de uma pessoa segurando um celular na vertical, a tela acesa mostra uma lista de contatos em fila com avatares redondos coloridos sem rostos nem nomes legíveis, várias novas entradas surgindo com brilho; fundo preto, luz dramática de cima"
    lista:
      k: "SUA LISTA"
      borda: vd
      itens: [[algoritmo, "📉 o algoritmo muda"], [fica, "📋 a lista fica"], [junto, "🧭 vai junto com você"]]
    painel: {k: "E-MAIL OU GRUPO", titulo: "A LISTA FICA", cor: "#FACC15", de: lista, borda: vd}
  - etapa: comentario
    fala: "E aí, você topa? Comenta: eu consigo, eu faço, ou eu vou tentar. Tá tudo no inema ponto club, ou me pede o link."
    prende: "compromisso positivo de uma frase, que a pessoa tem orgulho de escrever; puxa comentário e conversa"
    print: {url: "https://inematds.github.io/sobreviver-ia/guia/", selo: "plano de 90 dias · inema.club"}

