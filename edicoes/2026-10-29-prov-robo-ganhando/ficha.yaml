slug: prov-robo-ganhando
tema: Tem gente querendo destruir as máquinas antes que elas levem o emprego — quebrar não devolve o trabalho; quem se prepara fica
pedido: 'Nei, 29/10/2026: "vamos fazer um teste com as sugestoes q vc falou sobre os robos faz aqueles videos e me manda". TESTE do gancho de provocação (PADRAO §2.2), mesmo miolo de 2026-10-28-destruir-maquinas-emprego;
  só a abertura muda.'
plano:
  pessoa: trabalhador comum (motorista, entregador, operário, atendente) que tem medo de que a máquina faça o trabalho dele
  quer: não perder o emprego para o robô (dor) e virar quem comanda a máquina (desejo)
  gancho: 'perda hipotética: "e se amanhã a máquina fizer o seu trabalho?" + prova: nos comentários de um reel viral de robô de entrega chutado e carro sem motorista atacado, "eles estão roubando nossos
    empregos" (6 mil curtidas)'
  nota: 8
  destino: https://inematds.github.io/robot/ (curso Robótica do Zero ao Expert, aberto e gratuito, no inema.club)
  fatos:
  - 'Robôs de entrega chutados, montados ou pichados: Serve Robotics, menos de 1% de 100 mil viagens (Semafor, 01/04/2026); Filadélfia: robô de entrega chutado e pichado (reportagem local) — FATOS.md §2'
  - 'Comentário do reel viral de origem (robô de entrega chutado, gente pulando em carro sem motorista): "isso mesmo, eles estão roubando nossos empregos" (6 mil curtidas) — ficha 2026-10-23-guerra-maquinas'
  - 'Ludistas (Inglaterra): tecelões quebravam teares; Frame Breaking Act de 1812 tornou quebrar máquina crime com pena de morte; 12 mil soldados; 17 enforcados em York em 1813; o movimento acabou e as
    máquinas ficaram (Wikipedia "Luddite", Victorian Web) — FATOS.md §6'
  - 'WEF Future of Jobs 2025: até 2030, 170 milhões de empregos criados e 92 milhões eliminados; 39% das habilidades mudam (WEF, 08/01/2025) — FATOS.md §7'
  - 'Curso Robótica do Zero ao Expert, https://inematds.github.io/robot/ (conferida 28/10/2026): "CURSO ABERTO E GRATUITO · EDIÇÃO 2026", "Do primeiro LED ao robô com IA, no seu ritmo", "ESP32, sensores
    e motores; depois câmera e visão com Raspberry Pi 5, navegação com ROS 2 e, no fim, um braço que aprende por demonstração", "Nunca mexi com eletrônica. Trilha 1 · Primeiros passos: comece pelo 1.1,
    sem comprar nada: tudo roda no simulador"'
  - 'Área Robot, https://eventos.inema.pro/robot/ (conferida 28/10/2026): "Não precisa ter um robô: os cursos usam simuladores gratuitos" e "Os cursos do INEMA.CLUB são abertos e gratuitos"'
