publicar:
  fila: lives4
  titulo: 'É o fim do Python e do TypeScript? O Rust chegou #shorts'
  contexto: 'Short vertical do INEMA.CLUB (Nei Maldaner). O Rust está tomando partes da infraestrutura de IA: segundo um vídeo de referência, o motor do GitHub Copilot reescrito em Rust passou de 5,25 s
    para 292 ms de inicialização; o Codex CLI da OpenAI migrou de TypeScript para Rust; o núcleo do Pydantic em Rust é até 17× mais rápido; Polars, Ruff e uv são Rust dentro do ecossistema Python (números
    são alegações, sem benchmark independente). Mas não é o fim do Python nem do TypeScript: a IA continua sendo criada em Python, TS segue forte em apps e agentes, e o caminho é a arquitetura híbrida —
    Python/TS pensam e orquestram, Rust faz o trabalho pesado, a GPU faz a conta. Antes de reescrever, medir: se o agente espera 15 s pelo modelo, ganhar 200 ms não muda nada. CTA: veja o que tem no inema.club
    (https://inema.club) ou peça o link nos comentários.'
