slug: rust-fim-python
tema: É o fim do Python e do TypeScript? O Rust chegou na infraestrutura de IA
pedido: 'Nei, 21/10/2026: r7ex no lives4 "é o fim do Python e TypeScript", abertura com uma imagem deles (Python e TypeScript) e o Rust vindo voando como herói, texto grande e impactante na tela toda. Base:
  texto dele (Rust domina a infraestrutura de IA, mas Python/TS continuam; arquitetura híbrida).'
plano:
  pessoa: quem programa ou está aprendendo a programar com IA (Python, TypeScript) e quem usa Copilot/Codex no dia a dia
  quer: não perder tempo aprendendo a linguagem errada (medo) e saber onde investir o estudo (desejo)
  gancho: 'provocação + número: "é o fim do Python e do TypeScript?"; o Copilot passou de 5,25 s para 292 ms de inicialização reescrito em Rust (alegação do vídeo base)'
  nota: 8
  destino: https://inema.club
  fatos:
  - 'GitHub Copilot: motor reescrito em Rust, inicialização de 5,25 s para 292 ms (segundo o vídeo base; não verificado de forma independente)'
  - 'OpenAI Codex CLI: migração de TypeScript para Rust (texto base do Nei)'
  - 'Pydantic: núcleo de validação em Rust, ganhos de até 17 vezes (texto base)'
  - 'Polars, Ruff e uv: ferramentas do ecossistema Python feitas em Rust (texto base)'
  - bibliotecas em Rust podem ser usadas direto no Python (texto base, item 4 "Integração")
  - 'arquitetura: Python/TypeScript (agentes, orquestração) → Rust/C++ (tokenização, memória, servidores) → GPU/CUDA (texto base)'
  - se um agente leva 15 segundos esperando o modelo, economizar 200 ms na infraestrutura pouco muda (texto base)
  - '"Python continua forte para desenvolver IA. TypeScript continua forte para aplicações e agentes. Rust ganha espaço na infraestrutura" (conclusão do texto base); "a IA continua sendo desenvolvida principalmente
    em Python"'
