slug: ia-privada-sem-censura-lives4
tema: 'IA sem censura não garante privacidade: escolha onde seus textos são processados'
pedido: 'Nei: quero um vídeo publicado no lives4 r7ex. Tema desta conversa: kits IA privada pronta e IA sem censura
  pronta; distinguir privacidade de menos recusas, sem origem Skool.'
plano:
  pessoa: Quem usa IA no trabalho e não quer enviar textos a um serviço externo
  quer: Escolher onde seus textos são processados sem confundir liberdade de resposta com privacidade
  gancho: O modelo pode aceitar pedidos sem garantir que os dados fiquem no seu computador
  nota: 9
  destino: https://inematds.github.io/ia-privada-pronta/guia/
  fatos:
  - Privacidade é onde os dados são processados e quem tem acesso; menos recusas é comportamento do modelo. Não
    há implicação automática entre as duas coisas. Código e guias dos dois kits INEMA, README.md e docs/CONTRATO.md.
  - 'Prova real Linux15/11/2026: os DOIS modelos responderam dentro de namespace de rede contendo apenaslo. Fontes
    locais: ia-privada-pronta/verificacao/prova-real-linux.json e ia-sem-censura-pronta/verificacao/prova-real-linux.json.
    Modelos descarregados após teste.'
  - IA privada pronta usa Llama3.2; preparação baixa pesos com internet e conversa depois é local. Guia gratuito
    e código executável em https://inematds.github.io/ia-privada-pronta/guia/.
  - IA sem censura pronta usa Huihui Qwen3.8-abliterated27B voltado a menos recusas. Não mede nem garante ausência
    de recusas. Guia https://inematds.github.io/ia-sem-censura-pronta/guia/.
  - Os dois kits oferecem preparar/conversar/encerrar. Requerem Python e Ollama; versão maior exige mais memória.
    Não são chat em navegador nem implantação de nuvem testada.
  - No teste do documento Llama respondeu600, gabarito1000; Qwen acertou esse caso. Processamento local não garante
    acerto. Guias e códigos gratuitos; portal publica kits semanalmente.
