    fala: "Não precisa ser técnico. São cinco minutos por conta, com um aplicativo grátis no celular."
    imagem: "celular numa mesa preta mostrando um grande código numérico luminoso amarelo de seis dígitos, sem texto legível além dos números borrados; luz amarela de mesa"
    painel:
