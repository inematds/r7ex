publicar:
  fila: lives1
  titulo: "Uma senha fraca derrubou 350 supermercados — e o SMS do seu banco é o próximo #shorts"
  contexto: "Short vertical do INEMA.CLUB (Nei Maldaner). Em 11/10/2026, na França, hackers aqueceram até cerca de 50 °C as geladeiras de pelo menos 350 supermercados atacando controladores ligados à internet com senha fraca (Reuters). O código por SMS cai no golpe da troca de chip (SIM swap). Solução: app autenticador (código de 6 dígitos) ou passkey, na ordem e-mail → banco → WhatsApp, 5 minutos por conta. Checklist no projeto aberto sobreviver-ia, no inema.club. CTA: seu banco ainda usa SMS / peça o link."
