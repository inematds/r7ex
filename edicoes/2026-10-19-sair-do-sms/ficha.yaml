    fala: "E o código por SMS que protege o seu banco cai no golpe da troca de chip. O código vai parar no celular do golpista."
    imagem: "um chip de celular sendo puxado de um celular por uma pinça metálica, faíscas vermelhas saindo do encaixe, fundo preto; sensação de roubo"
    painel:
      k: "O GOLPE DO CHIP"
      borda: red
      itens: [[SMS, "💬 código por SMS"], [chip, "📲 troca de chip"], [golpista, "🥷 cai no celular do golpista"]]
