# Ficha r7ex — UM arquivo por reel com tudo. Exemplo real: o reel do hacker (18/10/2026), reescrito no gancho v1.2.0 (28/10/2026).
# Padrão completo em PADRAO.md. Rode `r7ex.py checar <pasta>` depois de editar.
slug: hacker
tema: "Hackers roubaram a chave de IA de um cara: US$ 1.700 numa noite"

plano:
  pessoa: "qualquer um que paga uma IA com cartão (ChatGPT, Claude, Gemini), não só programador"
  quer: "não acordar com uma conta absurda no cartão (dor) e dormir tranquilo (desejo)"
  gancho: "história de terceiro com número: hackers roubaram as chaves no OpenCode; relatos de US$ 1.700 numa noite (usuários afetados, out/2026)"
  nota: 8
  destino: "https://inema.club"
  fatos:
    - "ataque ao OpenCode (out/2026): chaves de IA roubadas; relatos de usuários com US$ 1.700 de conta numa noite"

# GANCHO (v1.2.0, PADRAO §2.1): o quadro 0 é a capa e os 3 primeiros segundos decidem se a pessoa fica.
gancho:
  tipo: terceiro                     # contrario | perda | estatistica | terceiro | noticia (lista é proibida)
  manchete: "ACORDOU DEVENDO US$ 1.700"   # ≤ 6 palavras, CAIXA ALTA, MAIS FORTE que a fala; desenhada pelo Codex no quadro 0
  destaque: "1.700"                  # UMA palavra da manchete, em amarelo
  objeto: "uma chave dourada partida ao meio, com um risco vermelho em cima, presa a um cartão de crédito rachado"   # dano/ameaça
  prova: {parte: 1, de: "1.700"}     # a palavra do número com fonte; até ~20 s (60 palavras)
  absolvicao: "não é descuido seu"   # o problema do espectador sem culpa, igual na fala da parte 2 ou 3
  fontes:                            # obrigatório em estatistica, terceiro e noticia (noticia também tem data: aaaa-mm-dd)
    - {nome: "relatos de usuários afetados pelo ataque ao OpenCode, out/2026", trecho: "US$ 1.700 de conta numa noite"}

marca: "INEMA · CHAVES DE IA"        # faixa do topo
selo: "ALERTA INEMA"                 # selo vermelho do topo
fonte: "<b>ataque ao OpenCode</b> · relatos de usuários afetados, out/2026 · imagens: ilustração"

abertura:                            # imagem 1: a cena; o título é a gancho.manchete (branco/destaque só nas fichas antigas)
  cor: amarelo
  cena: "quarto escuro de madrugada, um homem sentado na beira da cama, de lado, o rosto na sombra iluminado só pela luz vermelha do celular"

trocas:                              # fala (por extenso) → legenda (algarismo)
  "mil e setecentos dólares": "US$ 1.700"
  "mil dólares": "US$ 1.000"
  "três ajustes": "3 ajustes"

partes:
  - etapa: gancho
    fala: "Um cara foi dormir e acordou com mil e setecentos dólares de conta de IA. Roubaram a chave dele numa noite só."
    prende: "história de uma pessoa real com número que dói no bolso; a manchete na tela grita mais que a voz"
    painel:
      de: "1.700"                    # palavra em que o painel entra (padrão: início da parte)
      k: "ATAQUE AO OPENCODE · OUT/2026"
      borda: red                     # red | am | vd
      contador: {ate: 1700, em: "1.700", cor: "#ff2a1f", unid: "US$ NUMA NOITE"}
      l: "relatos de usuários afetados"
  - etapa: medo
    fala: "A chave é a senha que a IA usa pra cobrar de você, e a sua pode ser a próxima. E não é descuido seu: ninguém te avisou."
    prende: "o problema vira da pessoa ('a sua pode ser a próxima') e logo vem a absolvição, que faz ela ficar sem culpa"
    imagem: "uma mão encapuzada saindo de um notebook escuro e puxando uma chave dourada luminosa presa a um cartão de crédito; sensação de roubo"
    painel:
      k: "A CHAVE É A SUA SENHA"
      borda: red
      titulo: "A SUA PODE SER A PRÓXIMA"
  - etapa: desejo
    fala: "Imagina dormir sabendo que, mesmo se roubarem, o prejuízo tem teto."
    prende: "troca o medo por um desejo concreto: dormir tranquilo"
    imagem: "o mesmo quarto, agora em paz: homem dormindo tranquilo de lado, o rosto na sombra; na mesa de cabeceira, o celular com um escudo amarelo luminoso na tela"
    painel:
      k: "PREJUÍZO COM TETO"
      titulo: "O GASTO TEM TETO"
  - etapa: facilidade
    fala: "Você não precisa ser especialista, nem programador."
    prende: "derruba a desculpa 'isso não é para mim'"
    imagem: "um controle deslizante de limite travado por um cadeado amarelo luminoso, numa mesa escura"
    painel:
      k: "SEM SER ESPECIALISTA"
      titulo: "SEM PROGRAMAR"
  - etapa: descoberta
    fala: "São três ajustes: limite de gasto em cada chave, uma chave pra cada uso e um alarme quando o gasto foge do normal."
    prende: "o método com nome e 3 itens fáceis de lembrar"
    imagem: "um cadeado dourado com um medidor de gasto, sob foco de luz amarela, sobre uma mesa preta"
    lista:
      k: "OS 3 AJUSTES"
      itens: [[limite, "🧱 limite de gasto em cada chave"], [cada, "🔑 uma chave pra cada uso", 2], [alarme, "🚨 alarme quando foge do normal"]]
    painel:
      de: ajustes
      titulo: "3 AJUSTES"
  - etapa: beneficio
    fala: "O susto vira um aviso no celular, não uma conta de mil dólares."
    prende: "a máxima: uma frase curta que a pessoa repete"
    imagem: "close de um celular na mão mostrando uma notificação amarela de alerta (sem texto legível), e ao lado uma fatura de papel rasgada caindo"
    painel:
      k: "SEM LIMITE × COM LIMITE"
      borda: vd
      titulo: "SÓ UM AVISO"
